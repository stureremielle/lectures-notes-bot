# =============================================================================
# lectures-notes-bot — configuration
# Copy to config.yaml and fill in the URLs + secrets (or use .env / the
# stack's `environment:` block; ${ENV_VAR} placeholders are expanded).
# =============================================================================

llm:
  # Any OpenAI-compatible /chat/completions endpoint.
  base_url: "${OPENAI_BASE_URL:-https://api.openai.com/v1}"
  api_key: "${OPENAI_API_KEY}"
  model: "${OPENAI_MODEL:-gpt-4o-mini}"
  temperature: 0.2
  # Output cap. Notes + up to 10 assignments for a 2-hour lecture can reach
  # ~2500-3000 tokens; 4096 truncated long notes into invalid JSON. This is a
  # cap, not a cost: you only pay for tokens actually generated.
  max_tokens: 8000
  timeout: 180
  max_retries: 4

discord:
  # Two webhooks, two channels.
  # #notes    -> note embeds + note messages
  # #calendar -> assignment lists, .ics attachment, weekly PNG, reminders
  notes_webhook: "${DISCORD_NOTES_WEBHOOK}"
  calendar_webhook: "${DISCORD_CALENDAR_WEBHOOK}"
  username: "Catatan Kuliah"

notes:
  # Forced, never auto-detected.
  language: "id"
  # Transcripts longer than this are map-reduced (condense per chunk) before
  # the final call.
  max_transcript_chars: 60000
  condense: true
  condense_chunk_chars: 18000
  hard_cap_chars: 120000
  # Summarising models sometimes fold assignment instructions into the prose
  # and return an empty list. When that happens, a focused second call reads
  # only the paragraphs that mention tugas/kelompok/paper/deadline (a few
  # thousand tokens) and extracts them properly.
  assignment_second_pass: true
  assignment_context_chars: 12000

reminders:
  # ALL date math uses this zone. WITA — not WIB.
  timezone: "Asia/Makassar"

  # Offsets (in days) before the due date that get a reminder. 1 = T-1 (the day
  # before), 0 = T-0 (the due date itself). Default is T-1 only, so #calendar
  # is a "besok ada tenggat" channel rather than a feed.
  days_before: [1]

  # Earliest time of day the reminder pass may send (WITA).
  # IMPORTANT: this MUST be earlier than the first entry of
  # `watch.run_at_local`, otherwise the tick that should send the reminder
  # runs after the window opened and nothing fires on time. With the default
  # 19:00 tick, keep this at 08:00.
  send_time_local: "08:00"

  # Ping attached to every reminder: "@everyone", "@here", "role:<id>", or ""
  # to disable. Discord needs it in allowed_mentions, which the bot handles.
  mention: "@everyone"

watch:
  # "HH:MM" (string) or a list. Interpreted in reminders.timezone.
  #   one tick  : "19:00"          -> T-0 fires ~5h before a midnight deadline
  #   two ticks : ["07:00", "19:00"] -> much more notice at near-zero cost
  #               (the second tick only re-scans the playlist; only new
  #               uploads reach the LLM)
  run_at_local: "19:00"

  # Videos in this playlist that must never be processed (wrong uploads,
  # announcements, group-presentation clips, ...).
  ignore_ids: ["qssKcjWhDYk"]   # KELOMPOK 1 ANIMASI UDP & TCP (not a lecture)

  # First encounter with a playlist: enumerate, stamp the baseline, mark every
  # current video as skipped. Zero LLM calls. Set true to process those videos
  # once instead (oldest first).
  backfill_on_first_run: false

  # Which of the skipped videos a catch-up run takes when `--limit` is used:
  #   "oldest" (default) goes M1 -> M6 so lectures are learned in order,
  #   "newest" starts from the latest upload.
  backfill_order: "oldest"

calendar:
  # #calendar is reminder-only by default: it pings when a deadline is one day
  # away. The extras below are off; turn them on if you want them back.
  post_assignment_lists: false
  post_ics: false
  image:
    # Weekly 900x1020 month-grid PNG. Off by default: it is a static picture,
    # not a live calendar. Enable if you want the picture once per ISO week.
    enabled: false
    weekday: "monday"
    lead_days: 7
    output_dir: "data/calendar"

pipeline:
  # --dry-run never writes state.json; this flag exists only for debugging.
  save_state_on_dry_run: false
  # Course label when the video title gives no clue at all.
  course_fallback: "Lainnya"

assignments:
  # "minggu depan" said in a Monday lecture -> due the following Monday. The
  # anchor is the lecture's own date (upload date, or the date in the title
  # such as "SPK M1 2026 09 28"), so no class schedule needs to be configured.
  # Resolved dates are labelled as inferred in the notes and reminders.
  resolve_relative_dates: true

paths:
  data_dir: "data"
  state_file: "data/state.json"
  cache_dir: "data/cache"

logging:
  level: "INFO"

# -----------------------------------------------------------------------------
# Weekly schedule — only WHICH DAY each course meets, never rooms or hours.
# Used to anchor relative deadlines: "minggu depan" in a Monday lecture lands on
# the next Monday this course actually meets, so a lecture uploaded a day late
# does not shift the deadline.
# -----------------------------------------------------------------------------
schedule:
  Sistem Penunjang Keputusan: ["Senin"]
  Sistem Multimedia: ["Selasa"]
  Pengelolaan Proyek Sistem Informasi: ["Selasa"]
  Testing dan Implementasi Sistem: ["Rabu"]
  Business Intelligence: ["Jumat"]
  Sistem Terdistribusi: ["Jumat"]
  Analisis Kinerja Sistem: ["Sabtu"]

# -----------------------------------------------------------------------------
# Playlists.
#
# ONE playlist can hold every course of the semester. In that case the course of
# each video is resolved in this order:
#   1. `course_aliases` below, matched anywhere in the video title
#      ("M4 TIS 2026 10 29" -> "Testing dan Implementasi Sistem");
#   2. a configured `name` the title starts with;
#   3. the title prefix before a separator ("Sistem Multimedia - Pertemuan 3");
#   4. `pipeline.course_fallback`.
# The playlist `name` is the playlist label (e.g. "PTA 2026/2027"), not a course.
#
# Room numbers and class hours are intentionally not encoded anywhere.
# -----------------------------------------------------------------------------
playlists:
  - name: "PTA 2026/2027"
    url: "https://www.youtube.com/playlist?list=PLPeIrnQX78dU"
    enabled: true
    # Short codes used in the video titles -> the real course name. With one
    # playlist holding several courses, map each alias to its course
    # (the playlist `name` is only the playlist label).
    course_aliases:
      Sistem Penunjang Keputusan: ["SPK"]
      Sistem Multimedia: ["SM"]
      Pengelolaan Proyek Sistem Informasi: ["PPSI"]
      Testing dan Implementasi Sistem: ["TIS", "TDIS"]
      Business Intelligence: ["BI"]
      Sistem Terdistribusi: ["ST"]
      Analisis Kinerja Sistem: ["AKS"]
